services:
  calculator:
    image: ${DOCKER_IMAGE:-calculator}:${IMAGE_TAG:-compose}
    container_name: calculator-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks:
      - calculator-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: calculator-nginx
    ports:
      - "80:80"
    networks:
      - calculator-network
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  calculator-network:
    driver: bridge
